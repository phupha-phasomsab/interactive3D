<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <title>Three.js GLTF + HDR + Camera UI + Dialogue Choices</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
    }

    /* Dialogue Box */
    #dialogue-box {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 600px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
      font-family: "Tahoma", sans-serif;
      line-height: 1.5;
      display: none;
      z-index: 20;
    }

    #dialogue-name {
      font-weight: bold;
      margin-bottom: 8px;
      color: #ffcc66;
    }

    #dialogue-text {
      min-height: 50px;
    }

    #dialogue-next {
      margin-top: 10px;
      text-align: right;
      font-size: 14px;
      color: #aaa;
    }

    /* Choices */
    #choices {
      margin-top: 12px;
    }

    .choice {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      margin-top: 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Text Message */
    #text {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      text-align: center;
      z-index: 15;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>

  loadingScreen.style.display = 'none'; // ซ่อนหน้าจอโหลด

  loadingBar.style.width = progress + "%";
  loadingPercent.textContent = Math.round(progress) + "%";
};

// === Vertex Displacement Mesh ===
const uniformsDisp = {
  uTime: { value: 0.0 },
  uHeight: { value: null }
};

// Shader
const vertDisp = `
  uniform sampler2D uHeight;
  uniform float uTime;
  varying float vH;

  void main(){
    vec3 pos = position;
    float h = texture2D(uHeight, uv).r * sin(uTime + 1.5);
    pos.z += h * 0.8;       // ดัน vertex ตามค่าความสว่าง
    vH = h;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
  }
`;

const fragDisp = `
  precision mediump float;
  varying float vH;
  void main(){
    // ไล่สีตามค่าความสูง (ฟ้า-ชมพู)
    gl_FragColor = vec4(0.2+vH, 0.3-vH+0.2, 1.0*vH+0.1, 1.0);
  }
`;

// โหลด texture แล้วสร้าง mesh

  tex => {
    uniformsDisp.uHeight.value = tex;

    const geoDisp = new THREE.PlaneBufferGeometry(4, 2, 200, 200);
    const matDisp = new THREE.ShaderMaterial({
      vertexShader: vertDisp,
      fragmentShader: fragDisp,
      uniforms: uniformsDisp,
      side: THREE.DoubleSide
    });

    const meshDisp = new THREE.Mesh(geoDisp, matDisp);
    meshDisp.rotation.x = -Math.PI / 2; // หมุนราบถ้าต้องการ
    meshDisp.position.set(9.3, 3.73, 2.652);   // วางตรงไหนก็ได้ในฉาก
    meshDisp.scale.set(0.2, 0.1, 0.1);

    meshDisp.traverse((child) => {

        dialogueMap.set(child, [
                { name: "......", text: "...." },

      ]);
      }
    });
    // เก็บไว้ animate ใน render loop

      uniformsDisp.uTime.value += 0.05;

    renderer.setAnimationLoop(() => {
      updateDisplacement();

    });
  }

      // ===== Smooth Camera Move =====

      function moveCameraTo(customCamPos, lookAtTarget) {
        new TWEEN.Tween(camera.position)
          .to(customCamPos, 900) // customCamPos = {x:, y:, z:}
          .easing(TWEEN.Easing.Quadratic.InOut)
          .start();

        new TWEEN.Tween(controls.target)
          .to(lookAtTarget, 900) // lookAtTarget = {x:, y:, z:}
          .easing(TWEEN.Easing.Quadratic.InOut)
          .start();
      }


      // ===== Dialogue System =====
      const dialogueBox = document.getElementById("dialogue-box");
      const dialogueName = document.getElementById("dialogue-name");
      const dialogueText = document.getElementById("dialogue-text");
      const dialogueNext = document.getElementById("dialogue-next");
      const choicesDiv = document.getElementById("choices");

      let currentDialogue = [];
      let currentIndex = 0;
      let isTyping = false;
      let typingTimer;

      function showDialogue(index) {
        const d = currentDialogue[index];
        dialogueBox.style.display = "block";
        dialogueName.textContent = d.name;
        dialogueText.textContent = "";
        choicesDiv.innerHTML = "";
        dialogueNext.style.display = "block";

        if (d.choices) {
          dialogueNext.style.display = "none";
          d.choices.forEach(choice => {
            const btn = document.createElement("div");
            btn.className = "choice";
            btn.textContent = choice.text;
            btn.onclick = () => {
              if (choice.next) {
                startDialogue(choice.next);
              } else {
                dialogueBox.style.display = "none";
              }
            };
            choicesDiv.appendChild(btn);
          });
        } else {
          typeText(d.text);
        }
      }

      function typeText(text) {
        let i = 0;
        isTyping = true;
        typingTimer = setInterval(() => {
          dialogueText.textContent += text.charAt(i);
          i++;
          if (i >= text.length) {
            clearInterval(typingTimer);
            isTyping = false;
          }
        }, 40);
      }

      function startDialogue(dialogues) {
        currentDialogue = dialogues;
        currentIndex = 0;
        showDialogue(currentIndex);
      }

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" && dialogueBox.style.display === "block") {
          const d = currentDialogue[currentIndex];
          if (d.choices) return;
          if (isTyping) {
            clearInterval(typingTimer);
            dialogueText.textContent = d.text;
            isTyping = false;
          } else {
            currentIndex++;
            if (currentIndex < currentDialogue.length) {
              showDialogue(currentIndex);
            } else {
              dialogueBox.style.display = "none";
            }
          }
        }
      });
      const initialCamPos = { x: -8.7, y: 1.5, z: 0.1 };  // ตำแหน่งกล้องเริ่มต้น
      const initialTarget = { x: 0, y: 0.5, z: 0 };
      function isChildOf(parent, child) {
        if (!parent || !child) return false;
        if (parent === child) return true;
        let found = false;
        parent.traverse((c) => {
          if (c === child) found = true;
        });
        return found;
      }

      // Render loop
      function animate() {

      animate();

        camera.aspect = window.innerWidth / window.innerHeight;
