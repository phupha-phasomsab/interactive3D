<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <title>Three.js GLTF + HDR + Camera UI + Dialogue Choices</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
    }

    /* Dialogue Box */
    #dialogue-box {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 600px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
      font-family: "Tahoma", sans-serif;
      line-height: 1.5;
      display: none;
      z-index: 20;
    }

    #dialogue-name {
      font-weight: bold;
      margin-bottom: 8px;
      color: #ffcc66;
    }

    #dialogue-text {
      min-height: 50px;
    }

    #dialogue-next {
      margin-top: 10px;
      text-align: right;
      font-size: 14px;
      color: #aaa;
    }

    /* Choices */
    #choices {
      margin-top: 12px;
    }

    .choice {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      margin-top: 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Text Message */
    #text {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      text-align: center;
      z-index: 15;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>

<body>

  <div id="loading-screen" style="
  position: fixed;
  top:0; left:0; right:0; bottom:0;
  background:#000;
  display:flex;
  flex-direction: column;
  justify-content:center;
  align-items:center;
  color:#fff;
  font-family:Tahoma, sans-serif;
  font-size:18px;
  z-index:50;
">
  กำลังโหลด...
  <div style="
    width: 60%;
    height: 20px;
    background: #444;
    border-radius: 10px;
    margin-top: 10px;
    overflow: hidden;
  ">
    <div id="loading-bar" style="
      width: 0%;
      height: 100%;
      background: #ffcc66;
      border-radius: 10px;
    "></div>
  </div>
  <div id="loading-percent" style="margin-top:5px;">0%</div>
</div>
  <!-- Dialogue -->
  <div id="dialogue-box">
    <div id="dialogue-name"></div>
    <div id="dialogue-text"></div>
    <div id="choices"></div>
    <div id="dialogue-next">กด Space เพื่อไปต่อ...</div>
  </div>


  <script>
    (() => {
      const loadingScreen = document.getElementById('loading-screen');
const loadingBar = document.getElementById('loading-bar');
const loadingPercent = document.getElementById('loading-percent');

// สร้าง LoadingManager
const manager = new THREE.LoadingManager();

// โหลดเสร็จทั้งหมด
manager.onLoad = function() {
  loadingScreen.style.display = 'none'; // ซ่อนหน้าจอโหลด
};

// โหลดระหว่างทาง
manager.onProgress = function(url, itemsLoaded, itemsTotal) {
  const progress = (itemsLoaded / itemsTotal) * 100;
  loadingBar.style.width = progress + "%";
  loadingPercent.textContent = Math.round(progress) + "%";
};

// GLTFLoader ใช้ manager
const loader = new THREE.GLTFLoader(manager);

// ตัวอย่างโหลดโมเดล
loader.load("URL_MODEL_1.glb", gltf => {
  scene.add(gltf.scene);
});

loader.load("URL_MODEL_2.glb", gltf => {
  scene.add(gltf.scene);
});

// RGBELoader ใช้ manager ด้วย
new THREE.RGBELoader(manager)
  .setDataType(THREE.UnsignedByteType)
  .load("URL_HDR.hdr", tex => {
    const env = pmrem.fromEquirectangular(tex).texture;
    scene.background = env;
    scene.environment = env;
    tex.dispose();
    pmrem.dispose();
  });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(-8.7, 1.5, 0.1);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.5, 0);
      controls.enableDamping = true;

      // Raycaster & mouse
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      // HDR environment
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();

      new THREE.RGBELoader()
        .setDataType(THREE.UnsignedByteType)
        .load(
          "https://raw.githubusercontent.com/phupha-phasomsab/Asm/main/textures/floor%2Bwall/qwantani_sunset_1k.hdr",
          tex => {
            const env = pmrem.fromEquirectangular(tex).texture;

            // ตั้งค่า environment
            scene.background = env;
            scene.environment = env;

            // ปรับความสว่าง HDR ด้วย envMapIntensity ของวัสดุ
            const intensityFactor = 0.1; // ลดลงเหลือ 30% ของปกติ
            scene.traverse(obj => {
              if (obj.isMesh && obj.material) {
                // ถ้าวัสดุเป็น array
                if (Array.isArray(obj.material)) {
                  obj.material.forEach(mat => {
                    if (mat.isMeshStandardMaterial) {
                      mat.envMapIntensity = intensityFactor;
                      mat.needsUpdate = true;
                    }
                  });
                } else if (obj.material.isMeshStandardMaterial) {
                  obj.material.envMapIntensity = intensityFactor;
                  obj.material.needsUpdate = true;
                }
              }
            });

            tex.dispose();
            pmrem.dispose();
          }
        );
      // GLTF model
      loader.load(
        "https://raw.githubusercontent.com/phupha-phasomsab/interactive3D/main/Model/cafe.glb",
        gltf => {
          const model = gltf.scene;
          model.position.set(10, 0, 0);
          model.rotation.y = Math.PI;
          model.receiveShadow = true;
          model.castShadow = true;
          scene.add(model);
        }
      );
      loader.load(
        "https://raw.githubusercontent.com/phupha-phasomsab/interactive3D/main/Model/Text.glb",
        gltf => {
          const model = gltf.scene;
          model.scale.set(0.2, 0.2, 0.2);
          model.position.set(4.6, 2.5, 4.9);
          model.rotation.y = Math.PI;
          scene.add(model);
        }
      );

      // Ground
      const planeleft = new THREE.Mesh(
        new THREE.PlaneGeometry(15, 8),
        new THREE.MeshStandardMaterial({ color: 0x808080, metalness: 1, roughness: 0.3 })
      );
      planeleft.rotation.x = -Math.PI / 2;
      planeleft.position.y = 0.18;
      planeleft.position.x = 0;
      planeleft.position.z = -7.9;
      scene.add(planeleft);

      const planeright = new THREE.Mesh(
        new THREE.PlaneGeometry(15, 8),
        new THREE.MeshStandardMaterial({ color: 0x808080, metalness: 1, roughness: 0.3 })
      );
      planeright.rotation.x = -Math.PI / 2;
      planeright.position.y = 0.18;
      planeright.position.x = 0;
      planeright.position.z = 9.2;
      scene.add(planeright);


      const pointLight = new THREE.PointLight(0xffffff, 1.2, 5);
      pointLight.position.set(5, 5, 2); // วางด้านซ้าย-บน
      scene.add(pointLight);

      const ambient = new THREE.AmbientLight(0xffffff, 0.1); // ลด ambient เพื่อให้ shadow ชัด
      scene.add(ambient);
      // GUI for camera
      const gui = new dat.GUI();
      const camFolder = gui.addFolder('Camera Position');
      const camParams = {
        camX: camera.position.x,
        camY: camera.position.y,
        camZ: camera.position.z,
        targetX: controls.target.x,
        targetY: controls.target.y,
        targetZ: controls.target.z
      };
      camFolder.add(camParams, 'camX', -50, 50).onChange(val => camera.position.x = val);
      camFolder.add(camParams, 'camY', -50, 50).onChange(val => camera.position.y = val);
      camFolder.add(camParams, 'camZ', -50, 50).onChange(val => camera.position.z = val);
      camFolder.add(camParams, 'targetX', -50, 50).onChange(val => controls.target.x = val);
      camFolder.add(camParams, 'targetY', -50, 50).onChange(val => controls.target.y = val);
      camFolder.add(camParams, 'targetZ', -50, 50).onChange(val => controls.target.z = val);
      camFolder.open();

      // ===== Objects =====
      const objects = [];
      const dialogueMap = new Map();

      loader.load(
        "https://raw.githubusercontent.com/phupha-phasomsab/interactive3D/main/Model/Text-Profile.glb",
        gltf => {
          ProfileText = gltf.scene;
          ProfileText.scale.set(0.2, 0.2, 0.2);
          ProfileText.position.set(-6.7, 1.5, -0.6);
          ProfileText.rotation.y = Math.PI + 1.6;
          ProfileText.castShadow = true;
          ProfileText.receiveShadow = true;
          scene.add(ProfileText);

          // เพิ่มทุก mesh ใน ProfileText เข้า objects
          ProfileText.traverse((child) => {
            if (child.isMesh) {
              objects.push(child);
              dialogueMap.set(child, [
                { name: "unknow", text: "เฮ้! คุณคลิกที่ profile ของผม!" },
                { name: "หนึ่ง", text: "สามารถเรียกผมว่าหนึ่งได้นะ" },
                { name: "หนึ่ง", text: "นี่คือProfileของผม" }
              ]);
            }
          });
        }
      );

      // const cylinder = new THREE.Mesh(
      //   new THREE.CylinderGeometry(0.5, 0.5, 1.5, 32),
      //   new THREE.MeshStandardMaterial({ color: 0x0000ff })
      // );
      // cylinder.position.set(-6.7, 1, -0.6);
      // cylinder.castShadow = true;
      // cylinder.scale.set(0.5, 0.5, 0.5);
      // scene.add(cylinder);
      // objects.push(cylinder);
      // dialogueMap.set(cylinder, [
      //   { name: "Cylinder", text: "ฉันคือทรงกระบอกสีน้ำเงิน" },
      //   { name: "Cylinder", text: "สูง 1.5 รัศมี 0.5" },
      //   {
      //     name: "Cylinder", text: "คุณอยากทดสอบอะไรกับฉันไหม?",
      //     choices: [
      //       {
      //         text: "ลองหมุนฉัน", next: [
      //           { name: "Cylinder", text: "โอเค! ฉันหมุนรอบตัวเองได้!" }
      //         ]
      //       },
      //       {
      //         text: "ไม่เป็นไร", next: [
      //           { name: "Cylinder", text: "ก็ได้ งั้นไว้เจอกันใหม่!" }
      //         ]
      //       }
      //     ]
      //   }
      // ]);
      loader.load(
        "https://raw.githubusercontent.com/phupha-phasomsab/interactive3D/main/Model/Text-Project.glb",
        gltf => {
          ProjectText = gltf.scene;
          ProjectText.scale.set(0.2, 0.2, 0.2);
          ProjectText.position.set(-6.7, 1, -0.6);
          ProjectText.rotation.y = Math.PI + 1.6;
          ProjectText.castShadow = true;
          ProjectText.receiveShadow = true;
          scene.add(ProjectText);

          ProjectText.traverse((child) => {
            if (child.isMesh) {
              objects.push(child);
            }
          });
        }
      );
      loader.load(
        "https://raw.githubusercontent.com/phupha-phasomsab/interactive3D/main/Model/Text-Credit.glb",
        gltf => {
          CreditText = gltf.scene;
          CreditText.scale.set(0.2, 0.2, 0.2);
          CreditText.position.set(-6.7, 0.5, -0.6);
          CreditText.rotation.y = Math.PI + 1.6;
          CreditText.castShadow = true;
          scene.add(CreditText);

          CreditText.traverse((child) => {
            if (child.isMesh) {
              objects.push(child);
            }
          });
        }
      );

      loader.load(
        "https://raw.githubusercontent.com/phupha-phasomsab/interactive3D/main/Model/Cat.glb",
        gltf => {
          TalkingCat = gltf.scene;
          TalkingCat.scale.set(0.05, 0.05, 0.05);
          TalkingCat.position.set(7, 2.69, 4.167);
          TalkingCat.traverse((child) => {
            if (child.isMesh) {
              child.material = new THREE.MeshToonMaterial({
                map: child.material.map, // ถ้ามี texture เดิม
                color: 0xffffff          // สีพื้น
              });
            }
          });

          TalkingCat.castShadow = true;
          scene.add(TalkingCat);

          // เพิ่มลง objects + dialogueMap
          TalkingCat.traverse((child) => {
            if (child.isMesh) {
              objects.push(child);
              dialogueMap.set(child, [
                { name: "TalkingCat", text: "...." },
                { name: "TalkingCat", text: "...............?" },
                { name: "TalkingCat", text: "คุณคลิกที่ฉันเหรอ?" },
                {
                  name: "TalkingCat", text: "คุณอยากถามอะไรฉันรึเปล่า?",
                  choices: [
                    {
                      text: "เธอทำอะไรตรงนี้", next: [
                        { name: "TalkingCat", text: "ฉันเฝ้ารา้นแทนเจ้าของร้านนะ" },
                        { name: "TalkingCat", text: "ถึงแม้จะนอนอยู่ก็เถอะ" },
                        { name: "TalkingCat", text: "ถ้าไม่มีอะไรแล้วขอกลับไปนอนต่อนะ เมี๊ยว" }
                      ]
                    },
                    {
                      text: "ไม่มีอะไรขอตัวก่อน", next: [
                        { name: "TalkingCat", text: "โชคดีนะ แล้วเจอกันใหม่!" }
                      ]
                    }
                  ]
                }
              ]);
            }
          });
        }
      );


      // ===== Smooth Camera Move =====

      function moveCameraTo(customCamPos, lookAtTarget) {
        new TWEEN.Tween(camera.position)
          .to(customCamPos, 900) // customCamPos = {x:, y:, z:}
          .easing(TWEEN.Easing.Quadratic.InOut)
          .start();

        new TWEEN.Tween(controls.target)
          .to(lookAtTarget, 900) // lookAtTarget = {x:, y:, z:}
          .easing(TWEEN.Easing.Quadratic.InOut)
          .start();
      }


      // ===== Dialogue System =====
      const dialogueBox = document.getElementById("dialogue-box");
      const dialogueName = document.getElementById("dialogue-name");
      const dialogueText = document.getElementById("dialogue-text");
      const dialogueNext = document.getElementById("dialogue-next");
      const choicesDiv = document.getElementById("choices");

      let currentDialogue = [];
      let currentIndex = 0;
      let isTyping = false;
      let typingTimer;

      function showDialogue(index) {
        const d = currentDialogue[index];
        dialogueBox.style.display = "block";
        dialogueName.textContent = d.name;
        dialogueText.textContent = "";
        choicesDiv.innerHTML = "";
        dialogueNext.style.display = "block";

        if (d.choices) {
          dialogueNext.style.display = "none";
          d.choices.forEach(choice => {
            const btn = document.createElement("div");
            btn.className = "choice";
            btn.textContent = choice.text;
            btn.onclick = () => {
              if (choice.next) {
                startDialogue(choice.next);
              } else {
                dialogueBox.style.display = "none";
              }
            };
            choicesDiv.appendChild(btn);
          });
        } else {
          typeText(d.text);
        }
      }

      function typeText(text) {
        let i = 0;
        isTyping = true;
        typingTimer = setInterval(() => {
          dialogueText.textContent += text.charAt(i);
          i++;
          if (i >= text.length) {
            clearInterval(typingTimer);
            isTyping = false;
          }
        }, 40);
      }

      function startDialogue(dialogues) {
        currentDialogue = dialogues;
        currentIndex = 0;
        showDialogue(currentIndex);
      }

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" && dialogueBox.style.display === "block") {
          const d = currentDialogue[currentIndex];
          if (d.choices) return;
          if (isTyping) {
            clearInterval(typingTimer);
            dialogueText.textContent = d.text;
            isTyping = false;
          } else {
            currentIndex++;
            if (currentIndex < currentDialogue.length) {
              showDialogue(currentIndex);
            } else {
              dialogueBox.style.display = "none";
            }
          }
        }
      });
      const initialCamPos = { x: -8.7, y: 1.5, z: 0.1 };  // ตำแหน่งกล้องเริ่มต้น
      const initialTarget = { x: 0, y: 0.5, z: 0 };
      function isChildOf(parent, child) {
        if (!parent || !child) return false;
        if (parent === child) return true;
        let found = false;
        parent.traverse((c) => {
          if (c === child) found = true;
        });
        return found;
      }
      // ===== Click Event =====
      window.addEventListener('click', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const hits = raycaster.intersectObjects(objects);
        if (hits.length > 0) {
          const obj = hits[0].object;

          // กำหนดตำแหน่งกล้องเองตรงนี้
          if (isChildOf(ProfileText, obj)) {
            moveCameraTo(
              { x: 3.8, y: 3.4, z: 1.39 },
              { x: 4, y: 3.11, z: 4 }
            );
          } else if (isChildOf(ProjectText, obj)) {
            moveCameraTo(
              { x: -8, y: 3, z: -2 },
              { x: -9.7, y: 0.8, z: -2 }
            );
          } else if (isChildOf(CreditText, obj)) {
            moveCameraTo(
              { x: -3.5, y: 2.5, z: 6 },
              { x: 4.6, y: 2.5, z: 4.9 }
            );
          } else if (isChildOf(TalkingCat, obj)) {
            moveCameraTo(
              { x: 6.6, y: 2.8, z: 4 },
              { x: 7, y: 2.79, z: 4 }
            );
          } else {
            moveCameraTo(initialCamPos, initialTarget);
          }

          const dialogue = dialogueMap.get(obj);
          if (dialogue) {
            startDialogue(dialogue);
          }

        }
      });

      // Render loop
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        TWEEN.update();
        renderer.render(scene, camera);

        // sync GUI
        camParams.camX = camera.position.x;
        camParams.camY = camera.position.y;
        camParams.camZ = camera.position.z;
        camParams.targetX = controls.target.x;
        camParams.targetY = controls.target.y;
        camParams.targetZ = controls.target.z;
        camFolder.__controllers.forEach(c => c.updateDisplay());
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

    })();
  </script>
</body>

</html>
